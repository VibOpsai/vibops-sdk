[project]
name = "vibops"
version = "0.1.0"
description = "Python SDK for VibOps — The AI Infrastructure Engine"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["httpx>=0.27.0"]
readme = "README.md"
authors = [{name = "VibOps Inc."}]
keywords = ["vibops", "gpu", "ai-infrastructure", "sdk", "api-client"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://vibops.ai"
Repository = "https://github.com/VibOpsai/vibops-sdk"
Documentation = "https://vibops.ai"
Issues = "https://github.com/VibOpsai/vibops-sdk/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
